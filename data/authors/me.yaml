bio: |
  Bingxin Lin is a postdoctoral researcher in the Department of Psychological
  and Cognitive Sciences at Tsinghua University. Her research examines
  learning science, time perception, flow experience, and affective processes
  from behavioral and cognitive neuroscience perspectives. Her work combines
  experimental psychology with neurophysiological methods, including EEG/ERP,
  tDCS, and physiological sensing, to investigate how people perceive time,
  enter optimal learning and flow states, and express emotion-related bodily
  signals.

